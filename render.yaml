services:
  - type: web
    name: servicehub
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: servicehub-db
          property: connectionString
      - key: DATABASE_SSL
        value: false
      - key: NODE_ENV
        value: production
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: VITE_GEOAPIFY_API_KEY
        sync: false

databases:
  - name: servicehub-db
    plan: free
